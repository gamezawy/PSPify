name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        qt: [6, 5]
        include:
          - qt: 6
            spec: "PSPify.spec"
          - qt: 5
            spec: "PSPify (Legacy).spec"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pyqt${{ matrix.qt }}.txt
          python -m pip install pyinstaller

      - name: Build (PyInstaller)
        run: |
          pyinstaller "${{ matrix.spec }}" --clean
          ls -la dist

      - name: Package
        run: |
          mkdir out
          f="$(ls dist | head -n1)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "dist/$f" "out/PSPify-Windows-PyQt${{ matrix.qt }}.exe"
          else
            chmod +x "dist/$f"
            tar -czf "out/PSPify-Linux-PyQt${{ matrix.qt }}.tar.gz" -C dist "$f"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PSPify-${{ runner.os }}-PyQt${{ matrix.qt }}
          path: out/*
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - run: ls -la assets

      - uses: softprops/action-gh-release@v2
        with:
          name: PSPify ${{ github.ref_name }}
          files: assets/*
          generate_release_notes: true
